[Config]
MinimumVersion=28~devel

[Distribution]
Distribution=buildstream

[Content]
Hostname=elementary
Bootable=yes
InitrdPackages=stacks/initrd.bst
Bootloader=systemd-boot

[Build]
ToolsTree=yes
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=stonking
History=yes
CacheDirectory=mkosi.cache
Incremental=yes
ToolsTreePackages=
    buildstream
    python3-buildstream
    python3-buildstream-plugins
    python3-dulwich
    python3-tomlkit
    lzip

[Output]
ImageId=elementary
OutputDirectory=mkosi.output/
OutputSize=5G
Format=none
