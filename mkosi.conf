[Config]
MinimumVersion=28~devel

[Distribution]
Distribution=buildstream

[Content]
Hostname=elementary
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImageFormat=%i_%v_%a
InitrdPackages=stacks/initrd.bst
Packages=stacks/elementaryos.bst
KernelInitrdModules=default
KernelCommandLine=
    audit=0
    ipe.enforce=0
    mount.usr=dissect
    systemd.image_filter=usr=elementary_*:usr-verity=elementary_*:usr-verity-sig=elementary_*:root=elementary-*:swap=elementary-*:home=elementary-*
    systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:swap=encrypted+unused+absent:home=unprotected+absent:=ignore
    systemd.verity_usr_options=panic-on-corruption
    rw
    quiet
    splash

[Build]
ToolsTree=yes
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=stonking
History=yes
CacheDirectory=mkosi.cache
Incremental=yes
ToolsTreePackages=
    buildstream
    python3-buildstream
    python3-buildstream-plugins
    python3-dulwich
    python3-tomlkit
    lzip

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Output]
ImageId=elementary
OutputDirectory=mkosi.output
ManifestFormat=json
Output=%i_%v_%a