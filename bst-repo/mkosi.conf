[Config]
MinimumVersion=28~devel

[Distribution]
Distribution=buildstream

[Content]
Hostname=elementary
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImageFormat=%i_%v_%a
InitrdPackages=stacks/initrd.bst
Packages=stacks/elementaryos.bst
KernelInitrdModules=default
KernelCommandLine=
    rw
    quiet
    splash

[Build]
ToolsTree=yes
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=stonking
History=yes
CacheDirectory=mkosi.cache
Incremental=yes
ToolsTreePackages=
    buildstream
    python3-buildstream
    python3-buildstream-plugins
    python3-dulwich
    python3-tomlkit
    lzip

[Validation]
SecureBoot=no
SignExpectedPcr=no

[Output]
ImageId=elementary
OutputDirectory=mkosi.output
ManifestFormat=json
OutputSize=30G
Output=%i_%v_%a